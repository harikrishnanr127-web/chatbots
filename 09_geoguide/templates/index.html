<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEOGUIDE · Maps, climates and countries</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#CFE8F3;--card:#FBF5E6;--ink:#0F3B57;--bd:#0F3B57;--accent:#E07A1F;--onacc:#FFFFFF;--muted:#557489;--bot:#EFE7D2;--ub:#0F3B57;--uc:#FFFFFF;--pat:repeating-radial-gradient(circle at 80% 15%,transparent 0 22px,#B7D9E8 22px 24px);--sz:auto;--r:18px;--bw:2px;--sh:6px 6px 0 #0F3B57;--max:820px;--ls:0;--br:16px;--disp:"Rubik","Trebuchet MS",sans-serif;--body:"Karla","Segoe UI",sans-serif;}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background-color:var(--bg);background-image:var(--pat);background-size:var(--sz);display:flex;justify-content:center;padding:20px}
.app{width:100%;max-width:var(--max);height:calc(100vh - 40px);height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--card);border:var(--bw) solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
aside{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:var(--bw) solid var(--bd)}
.mark{flex:none;min-width:52px;height:52px;padding:0 8px;display:grid;place-items:center;background:var(--accent);color:var(--onacc);font:800 1.1rem var(--disp);border-radius:calc(var(--r)/2.5)}
h1{font:800 1.55rem/1 var(--disp);letter-spacing:var(--ls)}
aside p{color:var(--muted);font-size:.86rem;margin-top:4px}
.session{margin-left:auto;text-align:right;font-size:.78rem;color:var(--muted)}
.session b{display:block;font:700 1.2rem var(--disp);color:var(--ink);font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
#log{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.empty{margin:auto 0;max-width:520px}.empty h2{font:800 1.9rem/1.15 var(--disp);margin-bottom:8px}.empty p{color:var(--muted);line-height:1.5;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .9rem var(--body);color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip:hover{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.msg{max-width:88%;line-height:1.6;font-size:.98rem;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ub);color:var(--uc);padding:10px 16px;border-radius:var(--br) var(--br) 4px var(--br)}
.msg.bot{align-self:flex-start;background:var(--bot);padding:12px 16px 12px 18px;border-radius:4px var(--br) var(--br) var(--br);border-left:4px solid var(--accent)}
.msg.err{color:var(--muted)}
.msg p+p,.msg p+ul,.msg ul+p{margin-top:.6em}.msg ul{padding-left:1.2em}
.msg code{background:rgba(127,127,127,.22);padding:1px 6px;border-radius:5px;font-family:Consolas,Menlo,monospace;font-size:.88em}
.msg pre{background:#0d1117;color:#e6edf3;padding:12px 14px;border-radius:10px;overflow-x:auto;margin:.6em 0}.msg pre code{background:none;padding:0;color:inherit}
.wait{display:flex;gap:5px;padding:4px 0}.wait i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out}.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
form{display:flex;gap:10px;align-items:flex-end;padding:14px 16px;border-top:var(--bw) solid var(--bd)}
textarea{flex:1;resize:none;max-height:140px;font:400 1rem var(--body);color:var(--ink);background:var(--bot);border:1.5px solid var(--bd);border-radius:calc(var(--r)/1.6);padding:11px 14px;outline:none}
textarea:focus{border-color:var(--accent)}
.send{font:700 1rem var(--disp);color:var(--onacc);background:var(--accent);border:0;border-radius:calc(var(--r)/1.6);padding:11px 20px;cursor:pointer}
.send:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.v-rail .app{max-width:1040px;flex-direction:row}
.v-rail aside{flex-direction:column;align-items:flex-start;width:230px;border-bottom:0;border-right:var(--bw) solid var(--bd);padding:26px 20px}
.v-rail .session{margin:auto 0 0;text-align:left}
body.v-full{padding:0}.v-full .app{height:100vh;height:100dvh;border:0;box-shadow:none;background:transparent;max-width:900px}
.v-full aside,.v-full form{border:0}.v-full textarea,.v-full .send{border-radius:999px;padding-left:20px;padding-right:20px}
@media(max-width:700px){body{padding:0}.app{height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none}
.v-rail .app{flex-direction:column}.v-rail aside{width:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:var(--bw) solid var(--bd);padding:12px 16px}
.session,aside p{display:none}.msg{max-width:94%}.empty h2{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}</style></head>
<body class="v-card">
<div class="app">
<aside><div class="mark">N 45°</div><div><h1>GEOGUIDE</h1><p>Maps, climates and countries</p></div><div class="session">Time studying<b id="timer">00:00</b></div></aside>
<main class="chat">
<section id="log" aria-live="polite"><div class="empty" id="empty"><h2>Where in the world shall we go?</h2><p>GEOGUIDE only answers study-related questions.</p><div class="chips"><button class="chip" type="button">How are monsoons formed?</button><button class="chip" type="button">Types of rocks and landforms</button><button class="chip" type="button">Explain latitude and longitude</button><button class="chip" type="button">Quiz me on world capitals</button></div></div></section>
<form id="form" autocomplete="off"><textarea id="input" rows="1" maxlength="2000" placeholder="Ask a study question" aria-label="Your question"></textarea><button class="send" id="send" type="submit">Send</button></form>
</main></div>
<script>
const $=id=>document.getElementById(id);
const log=$("log"),form=$("form"),input=$("input"),sendBtn=$("send");const chatHist=[];
const t0=Date.now();setInterval(()=>{const t=Math.floor((Date.now()-t0)/1000),p=n=>String(n).padStart(2,"0");$("timer").textContent=p(Math.floor(t/60))+":"+p(t%60)},1000);
/* ---- tiny safe markdown renderer ---- */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function render(md) {
  const out = [];
  md.split(/```(?:\w+)?\n?/).forEach((part, i) => {
    if (i % 2) { out.push(`<pre><code>${esc(part.trim())}</code></pre>`); return; }
    let list = false;
    part.split("\n").forEach(line => {
      const li = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
      if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); }
      else { if (list) { out.push("</ul>"); list = false; } if (line.trim()) out.push(`<p>${inline(line)}</p>`); }
    });
    if (list) out.push("</ul>");
  });
  return out.join("");
}

/* ---- chat ---- */
function add(role, html, extra = "") {
  const el = document.createElement("div");
  el.className = `msg ${role} ${extra}`;
  el.innerHTML = html;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function ask(text) {
  text = text.trim();
  if (!text || sendBtn.disabled) return;
  const empty = $("empty"); if (empty) empty.remove();

  add("user", `<p>${esc(text)}</p>`);
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;
  const wait = add("bot", '<div class="wait"><i></i><i></i><i></i></div>');

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: chatHist.slice(-12) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    wait.innerHTML = render(data.reply);
    chatHist.push({ role: "user", text }, { role: "model", text: data.reply });
  } catch (e) {
    wait.classList.add("err");
    wait.innerHTML = `<p>${esc(e.message)}</p>`;
  } finally {
    sendBtn.disabled = false; input.focus(); log.scrollTop = log.scrollHeight;
  }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => ask(c.textContent)));
</script></body></html>
